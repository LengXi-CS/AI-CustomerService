# FastGPT Local Docker Compose (Optimized for Windows & Zero Port Conflicts)
x-default-root-psw: &x-default-root-psw '123456'
x-fe-domain: &x-fe-domain 'http://localhost:3001'
x-system-key: &x-system-key 'fastgpt-enterprise-root-key'
x-plugin-auth-token: &x-plugin-auth-token 'fastgpt_plugin_auth_token_32chars'
x-code-sandbox-token: &x-code-sandbox-token 'codesandbox'
x-aiproxy-token: &x-aiproxy-token 'aiproxytoken'

x-share-db-config: &x-share-db-config
  MONGODB_URI: mongodb://myusername:mypassword@fastgpt-mongo:27017/fastgpt?authSource=admin
  DB_MAX_LINK: 100
  REDIS_URL: redis://default:mypassword@fastgpt-redis:6379
  STORAGE_VENDOR: minio
  STORAGE_REGION: us-east-1
  STORAGE_ACCESS_KEY_ID: minioadmin
  STORAGE_SECRET_ACCESS_KEY: minioadmin
  STORAGE_PUBLIC_BUCKET: fastgpt-public
  STORAGE_PRIVATE_BUCKET: fastgpt-private
  STORAGE_DOWNLOAD_URL_MODE: short-proxy
  STORAGE_S3_ENDPOINT: http://fastgpt-minio:9000
  STORAGE_S3_FORCE_PATH_STYLE: true
  STORAGE_S3_MAX_RETRIES: 3

x-log-config: &x-log-config
  LOG_ENABLE_CONSOLE: true
  LOG_CONSOLE_LEVEL: info
  LOG_ENABLE_OTEL: false

x-no-proxy-config: &x-no-proxy-config
  NO_PROXY: localhost,127.0.0.1,::1,fastgpt-app,fastgpt-plugin,fastgpt-code-sandbox,fastgpt-aiproxy,fastgpt-aiproxy-pg,fastgpt-minio,fastgpt-mongo,fastgpt-redis,fastgpt-vector,host.docker.internal
  no_proxy: localhost,127.0.0.1,::1,fastgpt-app,fastgpt-plugin,fastgpt-code-sandbox,fastgpt-aiproxy,fastgpt-aiproxy-pg,fastgpt-minio,fastgpt-mongo,fastgpt-redis,fastgpt-vector,host.docker.internal

x-vec-config: &x-vec-config
  PG_URL: postgresql://username:password@fastgpt-vector:5432/postgres

services:
  fastgpt-vector:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/pgvector:0.8.0-pg15
    container_name: fastgpt-pg
    restart: always
    networks:
      - data
    environment:
      - POSTGRES_USER=username
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    volumes:
      - fastgpt-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'username', '-d', 'postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  fastgpt-mongo:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/mongo:5.0.32
    container_name: fastgpt-mongo
    restart: always
    networks:
      - data
    command: mongod --keyFile /data/mongodb.key --replSet rs0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=myusername
      - MONGO_INITDB_ROOT_PASSWORD=mypassword
    volumes:
      - fastgpt-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongo', '-u', 'myusername', '-p', 'mypassword', '--authenticationDatabase', 'admin', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    entrypoint:
      - bash
      - -c
      - |
        openssl rand -base64 128 > /data/mongodb.key
        chmod 400 /data/mongodb.key
        chown 999:999 /data/mongodb.key
        echo 'const isInited = rs.status().ok === 1
        if(!isInited){
          rs.initiate({
              _id: "rs0",
              members: [
                  { _id: 0, host: "fastgpt-mongo:27017" }
              ]
          })
        }' > /data/initReplicaSet.js
        exec docker-entrypoint.sh "$$@" &
        until mongo -u myusername -p mypassword --authenticationDatabase admin --eval "print('waited for connection')"; do
          sleep 2
        done
        mongo -u myusername -p mypassword --authenticationDatabase admin /data/initReplicaSet.js
        wait $$!

  fastgpt-redis:
    image: redis:7-alpine
    container_name: fastgpt-redis
    networks:
      - data
    restart: always
    command: |
      redis-server --requirepass mypassword --loglevel warning --maxclients 10000 --appendonly yes --save 60 10 --maxmemory 2gb --maxmemory-policy noeviction
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'mypassword', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    volumes:
      - fastgpt-redis:/data

  fastgpt-minio:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: fastgpt-minio
    restart: always
    ports:
      - 9010:9000
      - 9011:9001
    networks:
      - data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - fastgpt-minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  fastgpt-app:
    container_name: fastgpt-app
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt:v4.17.0
    ports:
      - 3001:3000
    networks:
      - data
      - app
      - codesandbox
      - aiproxy
    depends_on:
      fastgpt-mongo:
        condition: service_healthy
      fastgpt-vector:
        condition: service_healthy
      fastgpt-redis:
        condition: service_healthy
      fastgpt-minio:
        condition: service_healthy
      fastgpt-code-sandbox:
        condition: service_healthy
      fastgpt-plugin:
        condition: service_healthy
    restart: always
    volumes:
      - ./config.json:/app/data/config.json:ro
    environment:
      <<: [*x-share-db-config, *x-vec-config, *x-log-config, *x-no-proxy-config]
      HOSTNAME: 0.0.0.0
      FE_DOMAIN: *x-fe-domain
      ROOT_KEY: *x-system-key
      DEFAULT_ROOT_PSW: *x-default-root-psw
      DB_MAX_LINK: 20
      SYNC_INDEX: true
      SYSTEM_MAX_STRING_LENGTH_M: 100
      FILE_TOKEN_KEY: filetokenkey123456
      AES256_SECRET_KEY: fastgptsecret123456789012345678
      INVOKE_TOKEN_SECRET: fastgpt_invoke_token_secret_32_chars_min
      MULTIPLE_DATA_TO_BASE64: false
      PLUGIN_BASE_URL: http://fastgpt-plugin:3000
      PLUGIN_TOKEN: *x-plugin-auth-token
      CODE_SANDBOX_URL: http://fastgpt-code-sandbox:3000
      CODE_SANDBOX_TOKEN: *x-code-sandbox-token
      AIPROXY_API_ENDPOINT: http://fastgpt-aiproxy:3000
      AIPROXY_API_TOKEN: *x-aiproxy-token
      DATASET_PARSE_MAX_PROCESS: 10
      VECTOR_MAX_PROCESS: 10
      QA_MAX_PROCESS: 10
      VLM_MAX_PROCESS: 10
      HNSW_EF_SEARCH: 100
      HNSW_MAX_SCAN_TUPLES: 100000

  fastgpt-code-sandbox:
    container_name: fastgpt-code-sandbox
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-code-sandbox:v4.17.0
    networks:
      - codesandbox
    restart: always
    environment:
      <<: [*x-log-config, *x-no-proxy-config]
      SANDBOX_TOKEN: *x-code-sandbox-token
      SANDBOX_API_MAX_BODY_MB: 8
      SANDBOX_MAX_TIMEOUT: 60000
      SANDBOX_MAX_MEMORY_MB: 256
      SANDBOX_MAX_OUTPUT_MB: 10
      SANDBOX_POOL_SIZE: 3
    healthcheck:
      test: [
        'CMD',
        'node',
        '-e',
        "fetch('http://localhost:3000/health').then((res) => { if (!res.ok) throw new Error(String(res.status)); })"
      ]
      interval: 30s
      timeout: 20s
      retries: 3

  fastgpt-plugin:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-plugin:v1.1.3
    container_name: fastgpt-plugin
    restart: always
    networks:
      - data
      - app
    environment:
      <<: [*x-share-db-config, *x-log-config, *x-no-proxy-config]
      AUTH_TOKEN: *x-plugin-auth-token
      SERVICE_REQUEST_MAX_CONTENT_LENGTH: 10
      MAX_API_SIZE: 10
    depends_on:
      fastgpt-mongo:
        condition: service_healthy
      fastgpt-minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 20s
      retries: 3

  fastgpt-aiproxy:
    image: registry.cn-hangzhou.aliyuncs.com/labring/aiproxy:v0.6.5
    container_name: fastgpt-aiproxy
    restart: unless-stopped
    depends_on:
      fastgpt-aiproxy-pg:
        condition: service_healthy
    networks:
      - aiproxy
    environment:
      ADMIN_KEY: *x-aiproxy-token
      LOG_DETAIL_STORAGE_HOURS: 1
      SQL_DSN: postgres://postgres:aiproxy@fastgpt-aiproxy-pg:5432/aiproxy
      RETRY_TIMES: 3
      BILLING_ENABLED: false
      DISABLE_MODEL_CONFIG: true
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/status']
      interval: 5s
      timeout: 5s
      retries: 10

  fastgpt-aiproxy-pg:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/pgvector:0.8.0-pg15
    restart: unless-stopped
    container_name: fastgpt-aiproxy-pg
    volumes:
      - fastgpt-aiproxy_pg:/var/lib/postgresql/data
    networks:
      - aiproxy
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: postgres
      POSTGRES_DB: aiproxy
      POSTGRES_PASSWORD: aiproxy
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'aiproxy']
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  data:
    name: fastgpt_data
  app:
    name: fastgpt_app
  codesandbox:
    name: fastgpt_codesandbox
  aiproxy:
    name: fastgpt_aiproxy

volumes:
  fastgpt-pg:
  fastgpt-mongo:
  fastgpt-redis:
  fastgpt-minio:
  fastgpt-aiproxy_pg:
