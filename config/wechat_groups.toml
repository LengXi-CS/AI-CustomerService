# Non-secret WeChat group policy. Keep tokens and API keys in .env only.
#
# 热加载：本文件按 (mtime_ns, size) 监听，改完**下一跳消息即生效，无需重启服务**。
# 写坏语法时服务会保留上一份可用配置并落 logger.exception，不会打断正在服务的群。
# 详见 交接文档.md「群策略热加载」与 docs/配置项速查.md 第一节。

[global]
enabled = true
reply_to_staff_when_mentioned = true

# 安抚话术：客户提出「未命中标准意图」的需求时，回给他的那一句（非标准需求只安抚、不反问）。
#   model = 每个需求由模型现写一句，措辞不重复、更像真人（默认，与改动前行为一致）
#   fixed = 统一使用下面的 soothe_fixed_reply，措辞完全可控、不消耗模型调用
# 切换方式：改本文件即热加载，下一跳消息生效，无需重启。详见 docs/配置项速查.md「安抚话术」。
soothe_mode = "model"
soothe_fixed_reply = "收到，我们加急处理"

[[groups]]
group_id = "49195424680@chatroom"
group_name = "AI客服测试（外部）"
mode = "active"
native_quote_replies = true
associate_customer_demands = true
require_customer_mention = false
allow_images = true
allow_files = true
owner_id = "wxid_2i863b4r6r3y22"
# 测试群历史消息确认机器人的显示名；只将明确 @ 此昵称识别为 @机器人。
bot_aliases = ["瀚思商品助理"]
reply_to_staff_when_mentioned = true
conversation_quiet_window_seconds = 0





