[project]
name = "fastgpt-assistant"
version = "0.1.0"
description = "FastGPT-driven Enterprise Customer Service Assistant with WeChat Integration"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastgpt_assistant"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
